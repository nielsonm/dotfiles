name: Deploy Wiki to GitHub Wiki

on:
  push:
    branches: [ main, master ]
    paths:
      - 'wiki/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    name: Sync wiki/ to GitHub Wiki Git Repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to GitHub Wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          WIKI_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git"

          # Clone wiki repository or notify if not yet initialized
          if ! git clone "${WIKI_URL}" /tmp/wiki_repo 2>/dev/null; then
            echo "[!] Notice: GitHub Wiki repository is not yet initialized or enabled."
            echo "    To enable: In repository Settings -> Features -> Check 'Wikis' and create an initial page."
            exit 0
          fi

          # Sync markdown files from wiki/ into wiki repo root
          cp -r wiki/*.md /tmp/wiki_repo/
          cd /tmp/wiki_repo
          git add *.md

          if git diff --staged --quiet; then
            echo "Wiki is already up to date. No changes to commit."
          else
            git commit -m "docs(wiki): sync wiki pages from repository main"
            git push origin HEAD
            echo "Successfully published to GitHub Wiki."
          fi
