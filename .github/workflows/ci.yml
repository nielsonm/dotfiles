name: CI / Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Bash Shell Scripts Syntax
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n check_diffs.sh
          bash -n sync_active_config.sh
          bash -n check_secrets.sh
          echo "All shell scripts passed syntax validation."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax Check Python Scripts
        run: |
          python -m py_compile *.py tests/*.py

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Python Unit Tests
        run: |
          python -m unittest discover -s tests

      - name: Test CLI Executions
        run: |
          mkdir -p /tmp/fake_home
          python check_diffs.py --target /tmp/fake_home --summary-only
          python sync_active_config.py --source /tmp/fake_home --dry-run
          python check_secrets.py --target /tmp/fake_home
